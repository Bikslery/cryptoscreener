groups:
  - name: crypto-screener
    rules:
      - alert: WsClientKilledBackpressure
        expr: increase(cs_ws_clients_killed_backpressure_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "WS client killed by hard backpressure (buffered > {{ $labels }} ramp)"
          description: "A client fell too far behind and was dropped. Rising count means a slow subscriber or a hot lane."

      - alert: WsMessagesDropped
        expr: increase(cs_ws_messages_dropped_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WS frames dropped to lagging clients"
          description: "More than 100 WS frames were dropped in 5 minutes — check /api/debug/ws-stats for the lane."

      - alert: ExchangeIpBan418
        expr: increase(cs_ratelimit_418_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Exchange 418 (IP ban) received"
          description: "Binance throttled the server IP. Check rate-limit weight and REST fallback state."

      - alert: CandleCacheHoles
        expr: cs_candle_cache_holes > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Candle cache has unfilled holes"
          description: "The repair audit found missing periods that were not backfilled — charts may render flat candles."

      - alert: NoWsClients
        expr: cs_ws_clients_connected == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No connected WS clients"
          description: "Possibly expected (nobody browsing) or a broadcast-node outage."